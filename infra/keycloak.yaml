apiVersion: v1
kind: Secret
metadata:
  name: keycloak-admin
  namespace: yas-dev
type: Opaque
stringData:
  username: admin
  password: admin123
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm-yas
  namespace: yas-dev
data:
  realm-yas.json: |
    {
      "realm": "Yas",
      "enabled": true,
      "displayName": "Yas",
      "registrationAllowed": false,
      "rememberMe": true,
      "resetPasswordAllowed": true,
      "loginWithEmailAllowed": true,
      "duplicateEmailsAllowed": false,
      "roles": {
        "realm": [
          {
            "name": "ADMIN",
            "description": "Backoffice administrator role"
          }
        ]
      },
      "clients": [
        {
          "clientId": "storefront-bff",
          "name": "storefront-bff",
          "enabled": true,
          "publicClient": true,
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": true,
          "redirectUris": ["*"],
          "webOrigins": ["*"]
        },
        {
          "clientId": "backoffice-bff",
          "name": "backoffice-bff",
          "enabled": true,
          "publicClient": true,
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": true,
          "redirectUris": ["*"],
          "webOrigins": ["*"]
        },
        {
          "clientId": "swagger-ui",
          "name": "swagger-ui",
          "enabled": true,
          "publicClient": true,
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": true,
          "redirectUris": ["*"],
          "webOrigins": ["*"]
        }
      ],
      "users": [
        {
          "username": "yas-admin",
          "enabled": true,
          "emailVerified": true,
          "firstName": "Yas",
          "lastName": "Admin",
          "credentials": [
            {
              "type": "password",
              "value": "admin123",
              "temporary": false
            }
          ],
          "realmRoles": ["offline_access", "uma_authorization", "default-roles-yas", "ADMIN"]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: yas-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      nodeSelector:
        node.yas.io/tier: "large"
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.0
          args:
            - start-dev
            - --import-realm
            - --http-port=8080
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: username
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: password
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 8
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: 1000m
              memory: 1536Mi
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
      volumes:
        - name: realm-import
          configMap:
            name: keycloak-realm-yas
---
apiVersion: v1
kind: Service
metadata:
  name: identity
  namespace: yas-dev
spec:
  selector:
    app: keycloak
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: identity
  namespace: yas-dev
spec:
  rules:
    - host: identity
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: identity
                port:
                  number: 80
    - host: identity-dev.yas.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: identity
                port:
                  number: 80
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: identity-short
  namespace: yas-dev
spec:
  host: identity
  trafficPolicy:
    tls:
      mode: DISABLE
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: identity
  namespace: yas-dev
spec:
  host: identity.yas-dev.svc.cluster.local
  trafficPolicy:
    tls:
      mode: DISABLE
