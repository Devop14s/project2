apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-router
  namespace: yas-dev
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-router-nginx
  namespace: yas-dev
data:
  default.conf: |
    server {
      listen 8080;

      location /product/ {
        proxy_pass http://product;
      }
      location /media/ {
        proxy_pass http://media;
      }
      location /customer/ {
        proxy_pass http://customer;
      }
      location /location/ {
        proxy_pass http://location;
      }
      location /cart/ {
        proxy_pass http://cart;
      }
      location /order/ {
        proxy_pass http://order;
      }
      location /payment/ {
        proxy_pass http://payment;
      }
      location /inventory/ {
        proxy_pass http://inventory;
      }
      location /tax/ {
        proxy_pass http://tax;
      }
      location /search/ {
        proxy_pass http://search;
      }
      location /sampledata/ {
        proxy_pass http://sampledata;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-router
  namespace: yas-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-router
  template:
    metadata:
      labels:
        app: api-router
    spec:
      serviceAccountName: api-router
      nodeSelector:
        kubernetes.io/hostname: k3s-worker
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: config
          configMap:
            name: api-router-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: api-router
  namespace: yas-dev
spec:
  selector:
    app: api-router
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: api-router-public
  namespace: yas-dev
spec:
  selector:
    matchLabels:
      app: api-router
  mtls:
    mode: PERMISSIVE
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: api-router-public
  namespace: yas-dev
spec:
  selector:
    matchLabels:
      app: api-router
  action: ALLOW
  rules:
    - to:
        - operation:
            paths:
              - /product/*
              - /media/*
              - /customer/*
              - /location/*
              - /cart/*
              - /order/*
              - /payment/*
              - /inventory/*
              - /tax/*
              - /search/*
              - /sampledata/*
