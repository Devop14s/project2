server:
  port: 8087
spring:
  application:
    name: storefront-bff
  threads:
    virtual:
      enabled: true
  profiles:
    active: dev
  security:
    oauth2:
      client:
        provider:
          keycloak:
            authorization-uri: ${yas.identity.public-base-url}/realms/Yas/protocol/openid-connect/auth
            token-uri: ${yas.identity.internal-base-url}/realms/Yas/protocol/openid-connect/token
            user-info-uri: ${yas.identity.internal-base-url}/realms/Yas/protocol/openid-connect/userinfo
            jwk-set-uri: ${yas.identity.internal-base-url}/realms/Yas/protocol/openid-connect/certs
            user-name-attribute: preferred_username
            configuration-metadata:
              end_session_endpoint: ${yas.identity.public-base-url}/realms/Yas/protocol/openid-connect/logout
        registration:
          keycloak:
            provider: keycloak
            authorization-grant-type: authorization_code
            client-authentication-method: none
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-id: storefront-bff
            scope: openid, profile, email, roles
  data:
    redis:
      host: redis
      port: 6379
  session:
    store-type: redis
management:
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
    tags:
      application: ${spring.application.name}
#  endpoint:
#    gateway:
#      enabled: true
#  endpoints:
#    web:
#      exposure:
#        include: gateway,health,info
logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
#  level:
#    org.springframework.cloud.gateway: TRACE
#    reactor.netty.http.client: TRACE
yas:
  identity:
    internal-base-url: ${YAS_IDENTITY_INTERNAL_BASE_URL:http://identity}
    public-base-url: ${YAS_IDENTITY_PUBLIC_BASE_URL:http://identity-dev.yas.local}
  services:
    customer: http://api.yas.local/customer
    cart: http://api.yas.local/cart
    token-identity: ${yas.identity.internal-base-url}/realms/Yas/protocol/openid-connect/token
