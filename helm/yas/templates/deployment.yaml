{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
    spec:
      containers:
        - name: {{ $name }}
          image: "{{ $svc.image.repository }}:{{ $svc.image.tag }}"
          imagePullPolicy: {{ $svc.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: {{ $svc.containerPort }}
{{- if eq ($svc.workloadType | default "backend") "backend" }}
            - name: metric
              containerPort: {{ $svc.metricPort | default 8090 }}
{{- end }}
{{- if eq ($svc.workloadType | default "backend") "ui" }}
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
{{- else }}
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: metric
            initialDelaySeconds: 90
            periodSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: metric
            initialDelaySeconds: 90
            periodSeconds: 10
            failureThreshold: 5
{{- end }}
{{- if $svc.env }}
          env:
{{ toYaml $svc.env | indent 12 }}
{{- end }}
---
{{- end }}
{{- end }}
