{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
{{- $workloadType := $svc.workloadType | default "backend" }}
{{- $defaultProfileName := $.Values.global.scheduling.defaultProfile | default "worker" }}
{{- $profileName := $svc.schedulingProfile | default $defaultProfileName }}
{{- $schedulingProfile := get $.Values.global.scheduling.profiles $profileName | default dict }}
{{- $nodeSelector := $svc.nodeSelector | default $schedulingProfile.nodeSelector }}
{{- $affinity := $svc.affinity | default $schedulingProfile.affinity }}
{{- $tolerations := $svc.tolerations | default $schedulingProfile.tolerations }}
{{- $resourceProfile := get $.Values.global.resourceProfiles $workloadType | default dict }}
{{- $resources := $svc.resources | default $resourceProfile }}
{{- $probes := $svc.probes | default dict }}
{{- $probeMode := get $probes "mode" | default "" }}
{{- $probePort := get $probes "port" | default "http" }}
{{- $startupProbeInitialDelaySeconds := get $probes "startupInitialDelaySeconds" | default 10 }}
{{- $startupProbePeriodSeconds := get $probes "startupPeriodSeconds" | default 10 }}
{{- $startupProbeFailureThreshold := get $probes "startupFailureThreshold" | default 36 }}
{{- $probeInitialDelaySeconds := get $probes "initialDelaySeconds" | default 10 }}
{{- $probePeriodSeconds := get $probes "periodSeconds" | default 10 }}
{{- $probeFailureThreshold := get $probes "failureThreshold" | default 5 }}
{{- $metricPort := $svc.metricPort | default 8090 }}
{{- $resolvedProbePort := $probePort }}
{{- if eq ($probePort | toString) "http" }}
{{- $resolvedProbePort = $svc.containerPort }}
{{- else if eq ($probePort | toString) "metric" }}
{{- $resolvedProbePort = $metricPort }}
{{- end }}
{{- $hasDistinctMetricPort := and (eq $workloadType "backend") (ne ($metricPort | toString) ($svc.containerPort | toString)) }}
{{- $metricPortName := ternary "metric" "http" $hasDistinctMetricPort }}
{{- $replicaCount := ternary $svc.replicaCount 1 (hasKey $svc "replicaCount") }}
{{- $environmentName := $.Values.global.environment | default "default" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
spec:
  replicas: {{ $replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
{{- if $svc.podAnnotations }}
      annotations:
{{ toYaml $svc.podAnnotations | indent 8 }}
{{- end }}
    spec:
      serviceAccountName: {{ $name }}
{{- if $svc.hostAliases }}
      hostAliases:
{{ toYaml $svc.hostAliases | indent 8 }}
{{- end }}
{{- if $nodeSelector }}
      nodeSelector:
{{ toYaml $nodeSelector | indent 8 }}
{{- end }}
{{- if $affinity }}
      affinity:
{{ toYaml $affinity | indent 8 }}
{{- end }}
{{- if $tolerations }}
      tolerations:
{{ toYaml $tolerations | indent 8 }}
{{- end }}
{{- if $svc.extraVolumes }}
      volumes:
{{ toYaml $svc.extraVolumes | indent 8 }}
{{- end }}
{{- if $svc.initContainers }}
      initContainers:
{{ toYaml $svc.initContainers | indent 8 }}
{{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ $svc.image.repository }}:{{ $svc.image.tag }}"
          imagePullPolicy: {{ $svc.image.pullPolicy | default "IfNotPresent" }}
{{- if $svc.extraVolumeMounts }}
          volumeMounts:
{{ toYaml $svc.extraVolumeMounts | indent 12 }}
{{- end }}
          ports:
            - name: http
              containerPort: {{ $svc.containerPort }}
{{- if $hasDistinctMetricPort }}
            - name: metric
              containerPort: {{ $metricPort }}
{{- end }}
{{- if eq $workloadType "ui" }}
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
{{- else if eq $probeMode "tcp" }}
          startupProbe:
            tcpSocket:
              port: {{ $resolvedProbePort }}
            initialDelaySeconds: {{ $startupProbeInitialDelaySeconds }}
            periodSeconds: {{ $startupProbePeriodSeconds }}
            failureThreshold: {{ $startupProbeFailureThreshold }}
          livenessProbe:
            tcpSocket:
              port: {{ $resolvedProbePort }}
            initialDelaySeconds: {{ $probeInitialDelaySeconds }}
            periodSeconds: {{ $probePeriodSeconds }}
            failureThreshold: {{ $probeFailureThreshold }}
          readinessProbe:
            tcpSocket:
              port: {{ $resolvedProbePort }}
            initialDelaySeconds: {{ $probeInitialDelaySeconds }}
            periodSeconds: {{ $probePeriodSeconds }}
            failureThreshold: {{ $probeFailureThreshold }}
{{- else }}
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ $metricPortName }}
            initialDelaySeconds: {{ $startupProbeInitialDelaySeconds }}
            periodSeconds: {{ $startupProbePeriodSeconds }}
            failureThreshold: {{ $startupProbeFailureThreshold }}
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ $metricPortName }}
            initialDelaySeconds: {{ $probeInitialDelaySeconds }}
            periodSeconds: {{ $probePeriodSeconds }}
            failureThreshold: {{ $probeFailureThreshold }}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ $metricPortName }}
            initialDelaySeconds: {{ $probeInitialDelaySeconds }}
            periodSeconds: {{ $probePeriodSeconds }}
            failureThreshold: {{ $probeFailureThreshold }}
{{- end }}
{{- if $svc.env }}
          env:
{{- if ne $workloadType "ui" }}
            - name: SPRING_PROFILES_ACTIVE
              value: {{ $environmentName | quote }}
{{- end }}
{{ toYaml $svc.env | indent 12 }}
{{- else if ne $workloadType "ui" }}
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ $environmentName | quote }}
{{- end }}
{{- if $resources }}
          resources:
{{ toYaml $resources | indent 12 }}
{{- end }}
---
{{- end }}
{{- end }}
