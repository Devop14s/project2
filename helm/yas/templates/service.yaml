{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
{{- $metricPort := $svc.metricPort | default 8090 }}
{{- $hasDistinctMetricPort := and (eq ($svc.workloadType | default "backend") "backend") (ne ($metricPort | toString) ($svc.containerPort | toString)) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
spec:
  type: {{ $svc.service.type | default "ClusterIP" }}
  selector:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
  ports:
    - name: http
      port: {{ $svc.service.port }}
      targetPort: {{ $svc.containerPort }}
{{- if eq ($svc.service.type | default "ClusterIP") "NodePort" }}
      nodePort: {{ $svc.service.nodePort }}
{{- end }}
{{- if $hasDistinctMetricPort }}
    - name: metric
      port: {{ $metricPort }}
      targetPort: {{ $metricPort }}
{{- end }}
---
{{- range $alias := $svc.service.aliases | default list }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $alias }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
  ports:
    - name: http
      port: {{ $svc.service.port }}
      targetPort: {{ $svc.containerPort }}
---
{{- end }}
{{- end }}
{{- end }}
