{{- range $name, $svc := .Values.services }}
{{- if and $svc.enabled $svc.ingress $svc.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
spec:
  rules:
    - host: {{ $svc.ingress.host | quote }}
      http:
        paths:
{{- range $path := ($svc.ingress.extraPaths | default list) }}
          - path: {{ $path.path | quote }}
            pathType: {{ $path.pathType | default "Prefix" }}
            backend:
              service:
                name: {{ $path.serviceName | quote }}
                port:
                  number: {{ $path.servicePort }}
{{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $svc.ingress.defaultServiceName | default (printf "%s-%s" $.Release.Name $name) }}
                port:
                  number: {{ $svc.ingress.defaultServicePort | default $svc.service.port }}
---
{{- end }}
{{- end }}
