      limits:
        cpu: 750m
        memory: 768Mi
    env:
      - name: JAVA_TOOL_OPTIONS
        value: "-Xmx192m -Xms64m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=32m"
      - name: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://postgres.yas-dev.svc.cluster.local:5432/order
      - name: SPRING_DATASOURCE_USERNAME
        value: admin
      - name: SPRING_DATASOURCE_PASSWORD
        value: admin

  inventory:
    enabled: true
    schedulingProfile: worker-large
    containerPort: 8090
    metricPort: 8090
    image:
      repository: luongtrz/yas-inventory
      tag: main
    service:
      aliases:
        - inventory
    probes:
      mode: tcp
      port: http
    resources:
      requests:
        cpu: 100m
        memory: 192Mi
      limits:
        cpu: 750m
        memory: 768Mi
    env:
      - name: JAVA_TOOL_OPTIONS
        value: "-Xmx192m -Xms64m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=32m"
      - name: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://postgres.yas-dev.svc.cluster.local:5432/inventory
      - name: SPRING_DATASOURCE_USERNAME
        value: admin
      - name: SPRING_DATASOURCE_PASSWORD
        value: admin

  tax:
    enabled: true
    schedulingProfile: worker-large
    containerPort: 8091
    metricPort: 8091
    image:
      repository: luongtrz/yas-tax
      tag: main
    service:
      aliases:
        - tax
    probes:
      mode: tcp
      port: http
    resources:
      requests:
        cpu: 100m
        memory: 192Mi
      limits:
        cpu: 750m
        memory: 768Mi
    env:
      - name: JAVA_TOOL_OPTIONS
        value: "-Xmx192m -Xms64m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=32m"
      - name: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://postgres.yas-dev.svc.cluster.local:5432/tax
      - name: SPRING_DATASOURCE_USERNAME
        value: admin
      - name: SPRING_DATASOURCE_PASSWORD
        value: admin

  media:
    enabled: true
    schedulingProfile: ui-on-master
    containerPort: 8083
    metricPort: 8083
    image:
      repository: luongtrz/yas-media
      tag: 20260706-media-security-v2
    service:
      aliases:
        - media
    extraVolumes:
      - name: media-sample-images
        hostPath:
          path: /home/luong/project2/yas-source/sampledata/images
          type: Directory
    extraVolumeMounts:
      - name: media-sample-images
        mountPath: /images
        readOnly: true
    probes:
      mode: tcp
      port: http
    resources:
      requests:
        cpu: 100m
        memory: 192Mi
      limits:
        cpu: 750m
        memory: 768Mi
    env:
      - name: JAVA_TOOL_OPTIONS
        value: "-Xmx192m -Xms64m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=32m"
      - name: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://postgres.yas-dev.svc.cluster.local:5432/media
      - name: SPRING_DATASOURCE_USERNAME
        value: admin
      - name: SPRING_DATASOURCE_PASSWORD
        value: admin
      - name: SERVER_SERVLET_CONTEXT_PATH
        value: /media
      - name: YAS_PUBLICURL
        value: http://api.yas.local/media

  search:
    enabled: true
    schedulingProfile: worker-large
    containerPort: 8092
    metricPort: 8092
    image:
      repository: luongtrz/yas-search
      tag: main
    service:
      aliases:
        - search
    probes:
      mode: tcp
      port: http
    resources:
      requests:
        cpu: 100m
        memory: 192Mi
      limits:
        cpu: 750m
        memory: 768Mi
    env:
      - name: JAVA_TOOL_OPTIONS
        value: "-Xmx192m -Xms64m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=32m"
      - name: SPRING_KAFKA_CONSUMER_BOOTSTRAP_SERVERS
        value: kafka.yas-dev.svc.cluster.local:9092
      - name: SPRING_KAFKA_PRODUCER_BOOTSTRAP_SERVERS
        value: kafka.yas-dev.svc.cluster.local:9092
      - name: ELASTICSEARCH_URL
        value: elasticsearch.yas-dev.svc.cluster.local:9200

  rating:
    enabled: false
    schedulingProfile: worker-large

  location:
    enabled: false
    schedulingProfile: worker-large

  promotion:
    enabled: false
    schedulingProfile: worker-large

  payment:
    enabled: false
    schedulingProfile: worker-large

  payment-paypal:
    enabled: false
    schedulingProfile: worker-large

  recommendation:
    enabled: false
    schedulingProfile: worker-large

  webhook:
    enabled: false
    schedulingProfile: worker-large

  sampledata:
    enabled: true
    schedulingProfile: worker-large
    replicaCount: 1
    containerPort: 8094
    metricPort: 8094
    image:
      repository: luongtrz/yas-sampledata
      tag: main
    service:
      aliases:
        - sampledata
    probes:
      mode: tcp
      port: http
    resources:
      requests:
        cpu: 100m
        memory: 192Mi
      limits:
        cpu: 750m
        memory: 768Mi
    env:
      - name: JAVA_TOOL_OPTIONS
        value: "-Xmx192m -Xms64m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=32m"
      - name: SPRING_DATASOURCE_PRODUCT_URL
        value: jdbc:postgresql://postgres.yas-dev.svc.cluster.local:5432/product
      - name: SPRING_DATASOURCE_MEDIA_URL
        value: jdbc:postgresql://postgres.yas-dev.svc.cluster.local:5432/media
      - name: SPRING_DATASOURCE_USERNAME
        value: admin
      - name: SPRING_DATASOURCE_PASSWORD
        value: admin
