      limits:
        cpu: 750m
        memory: 768Mi
    env:
      - name: JAVA_TOOL_OPTIONS
        value: "-Xmx192m -Xms64m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=32m"
      - name: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://postgres.yas-dev.svc.cluster.local:5432/customer
      - name: SPRING_DATASOURCE_USERNAME
        value: admin
      - name: SPRING_DATASOURCE_PASSWORD
        value: admin

  order:
    enabled: true
    schedulingProfile: worker-large
    containerPort: 8085
    metricPort: 8085
    image:
      repository: luongtrz/yas-order
      tag: main
    service:
      aliases:
        - order
    probes:
      mode: tcp
      port: http
    resources:
      requests:
        cpu: 100m
