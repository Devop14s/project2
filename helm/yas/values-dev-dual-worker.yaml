global:
  environment: dev
  namespace: yas-dev
  domainName: storefront-dev.yas.local

services:
  storefront:
    enabled: true
    schedulingProfile: ui-on-master
    podAnnotations:
      sidecar.istio.io/inject: "false"
    image:
      repository: luongtrz/yas-storefront
      tag: main
    service:
      aliases:
        - storefront
    ingress:
      enabled: true
      host: storefront-dev.yas.local
      extraPaths:
        - path: /oauth2
          serviceName: yas-dev-storefront-bff
          servicePort: 80
        - path: /login
          serviceName: yas-dev-storefront-bff
          servicePort: 80
        - path: /logout
          serviceName: yas-dev-storefront-bff
          servicePort: 80
        - path: /api
          serviceName: yas-dev-storefront-bff
          servicePort: 80
        - path: /actuator/health
          serviceName: yas-dev-storefront-bff
          servicePort: 80
        - path: /actuator/health/liveness
          serviceName: yas-dev-storefront-bff
          servicePort: 80
        - path: /actuator/health/readiness
          serviceName: yas-dev-storefront-bff
          servicePort: 80

  backoffice:
    enabled: true
    schedulingProfile: ui-on-master
    podAnnotations:
      sidecar.istio.io/inject: "false"
    image:
      repository: luongtrz/yas-backoffice
      tag: main
    service:
      aliases:
        - backoffice
    ingress:
      enabled: true
      host: backoffice-dev.yas.local
      extraPaths:
        - path: /oauth2
          serviceName: yas-dev-backoffice-bff
          servicePort: 80
        - path: /login
          serviceName: yas-dev-backoffice-bff
          servicePort: 80
        - path: /logout
          serviceName: yas-dev-backoffice-bff
          servicePort: 80
        - path: /api
          serviceName: yas-dev-backoffice-bff
          servicePort: 80
        - path: /catalog
          serviceName: yas-dev-backoffice-bff
          servicePort: 80
        - path: /customers
          serviceName: yas-dev-backoffice-bff
          servicePort: 80
        - path: /sales
          serviceName: yas-dev-backoffice-bff
          servicePort: 80
        - path: /location
          serviceName: yas-dev-backoffice-bff
          servicePort: 80
        - path: /inventory
          serviceName: yas-dev-backoffice-bff
          servicePort: 80
        - path: /promotion
          serviceName: yas-dev-backoffice-bff
          servicePort: 80
        - path: /tax
          serviceName: yas-dev-backoffice-bff
          servicePort: 80
        - path: /system
          serviceName: yas-dev-backoffice-bff
          servicePort: 80
        - path: /webhook
          serviceName: yas-dev-backoffice-bff
          servicePort: 80
        - path: /profile
          serviceName: yas-dev-backoffice-bff
          servicePort: 80
        - path: /actuator/health
          serviceName: yas-dev-backoffice-bff
          servicePort: 80
        - path: /actuator/health/liveness
          serviceName: yas-dev-backoffice-bff
          servicePort: 80
        - path: /actuator/health/readiness
          serviceName: yas-dev-backoffice-bff
          servicePort: 80

  swagger-ui:
    enabled: true
    schedulingProfile: ui-on-master
    podAnnotations:
      sidecar.istio.io/inject: "false"
    image:
      repository: luongtrz/yas-swagger-ui
      tag: main
    service:
      aliases:
        - swagger-ui
    ingress:
      enabled: true
      host: swagger-ui-dev.yas.local

  storefront-bff:
    enabled: true
    schedulingProfile: worker-large
    containerPort: 8087
    metricPort: 8087
    image:
      repository: luongtrz/yas-storefront-bff
      tag: 20260705-step2fix2
    service:
      aliases:
        - storefront-bff
    probes:
      mode: tcp
      port: http
    resources:
      requests:
        cpu: 100m
        memory: 192Mi
      limits:
        cpu: 750m
        memory: 768Mi
    env:
      - name: JAVA_TOOL_OPTIONS
        value: "-Xmx192m -Xms64m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=32m"

  backoffice-bff:
    enabled: true
    schedulingProfile: worker-large
    containerPort: 8087
    metricPort: 8087
    image:
      repository: luongtrz/yas-backoffice-bff
      tag: 20260705-step2fix2
    service:
      aliases:
        - backoffice-bff
    probes:
      mode: tcp
      port: http
    resources:
      requests:
        cpu: 100m
        memory: 192Mi
      limits:
        cpu: 750m
        memory: 768Mi
    env:
      - name: JAVA_TOOL_OPTIONS
        value: "-Xmx192m -Xms64m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=32m"

  product:
    enabled: true
    schedulingProfile: worker-large
    containerPort: 8080
    metricPort: 8080
    image:
      repository: luongtrz/yas-product
      tag: main
    service:
      aliases:
        - product
    probes:
      mode: tcp
      port: http
    resources:
      requests:
        cpu: 100m
        memory: 192Mi
      limits:
        cpu: 750m
        memory: 768Mi
    env:
      - name: JAVA_TOOL_OPTIONS
        value: "-Xmx192m -Xms64m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=32m"
      - name: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://postgres.yas-dev.svc.cluster.local:5432/product
      - name: SPRING_DATASOURCE_USERNAME
        value: admin
      - name: SPRING_DATASOURCE_PASSWORD
        value: admin
      - name: YAS_SERVICES_MEDIA
        value: http://media.yas-dev.svc.cluster.local/media

  cart:
    enabled: true
    schedulingProfile: worker-large
    containerPort: 8084
    metricPort: 8084
    image:
      repository: luongtrz/yas-cart
      tag: main
    service:
      aliases:
        - cart
    probes:
      mode: tcp
      port: http
    resources:
      requests:
        cpu: 100m
        memory: 192Mi
      limits:
        cpu: 750m
        memory: 768Mi
    env:
      - name: JAVA_TOOL_OPTIONS
        value: "-Xmx192m -Xms64m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=32m"
      - name: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://postgres.yas-dev.svc.cluster.local:5432/cart
      - name: SPRING_DATASOURCE_USERNAME
        value: admin
      - name: SPRING_DATASOURCE_PASSWORD
        value: admin

  customer:
    enabled: true
    schedulingProfile: worker-large
    containerPort: 8088
    metricPort: 8088
    image:
      repository: luongtrz/yas-customer
      tag: main
    service:
      aliases:
        - customer
    probes:
      mode: tcp
      port: http
    resources:
      requests:
        cpu: 100m
