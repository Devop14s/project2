global:
  environment: default
  namespace: default
  domainName: yas.local

services:
  storefront:
    enabled: true
    workloadType: ui
    image:
      repository: docker.io/example/yas-storefront
      tag: main
      pullPolicy: IfNotPresent
    containerPort: 3000
    service:
      type: NodePort
      port: 3000
      nodePort: 32080
    ingress:
      enabled: true
      host: storefront.yas.local

  backoffice:
    enabled: true
    workloadType: ui
    image:
      repository: docker.io/example/yas-backoffice
      tag: main
      pullPolicy: IfNotPresent
    containerPort: 3000
    service:
      type: NodePort
      port: 3000
      nodePort: 32081
    ingress:
      enabled: true
      host: backoffice.yas.local

  storefront-bff:
    enabled: true
    workloadType: backend
    image:
      repository: docker.io/example/yas-storefront-bff
      tag: main
      pullPolicy: IfNotPresent
    containerPort: 80
    metricPort: 8090
    service:
      type: ClusterIP
      port: 80

  backoffice-bff:
