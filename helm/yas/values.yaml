global:
  environment: default
  namespace: default
  domainName: yas.local
  scheduling:
    defaultProfile: worker
    profiles:
      worker:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: DoesNotExist
      worker-small:
        nodeSelector:
          node.yas.io/tier: "large"
      worker-large:
        nodeSelector:
          node.yas.io/tier: "large"
      ui-on-master:
        nodeSelector:
          node-role.kubernetes.io/control-plane: "true"
        tolerations:
          - key: node-role.kubernetes.io/control-plane
            operator: Equal
            value: "true"
            effect: NoSchedule
  resourceProfiles:
    ui:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 512Mi
    backend:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 384Mi

services:
  storefront:
    enabled: true
    workloadType: ui
    schedulingProfile: ui-on-master
    image:
      repository: docker.io/example/yas-storefront
      tag: main
      pullPolicy: IfNotPresent
    containerPort: 3000
    service:
      type: NodePort
      port: 3000
      nodePort: 32080
    ingress:
      enabled: true
      host: storefront.yas.local

  backoffice:
    enabled: true
    workloadType: ui
    schedulingProfile: ui-on-master
    image:
      repository: docker.io/example/yas-backoffice
      tag: main
      pullPolicy: IfNotPresent
    containerPort: 3000
    service:
      type: NodePort
      port: 3000
      nodePort: 32081
    ingress:
