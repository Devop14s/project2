global:
  environment: staging
  namespace: yas-staging
  domainName: storefront-staging.yas.local

externalServices:
  identity:
    externalName: identity.yas-dev.svc.cluster.local

services:
  storefront:
    enabled: true
    schedulingProfile: ui-on-master
    podAnnotations:
      sidecar.istio.io/inject: "false"
    hostAliases:
      - ip: 100.96.101.91
        hostnames:
          - api.yas.local
    image:
      repository: luongtrz/yas-storefront
      tag: main
    env:
      - name: API_BASE_PATH
        value: http://api.yas.local
    service:
      aliases:
        - storefront
      nodePort: 32083
    ingress:
      enabled: true
      host: storefront-staging.yas.local
      extraPaths:
        - path: /oauth2
          serviceName: storefront-bff
          servicePort: 80
        - path: /login
          serviceName: storefront-bff
          servicePort: 80
        - path: /logout
          serviceName: storefront-bff
          servicePort: 80
        - path: /api
          serviceName: storefront-bff
          servicePort: 80
        - path: /authentication
          serviceName: storefront-bff
          servicePort: 80
        - path: /actuator/health
          serviceName: storefront-bff
          servicePort: 80
        - path: /actuator/health/liveness
          serviceName: storefront-bff
          servicePort: 80
        - path: /actuator/health/readiness
          serviceName: storefront-bff
          servicePort: 80

  backoffice:
    enabled: true
    schedulingProfile: ui-on-master
    podAnnotations:
      sidecar.istio.io/inject: "false"
    hostAliases:
      - ip: 100.96.101.91
        hostnames:
          - api.yas.local
    image:
      repository: luongtrz/yas-backoffice
      tag: main
    service:
      aliases:
        - backoffice
      nodePort: 32084
    ingress:
      enabled: true
      host: backoffice-staging.yas.local
      extraPaths:
        - path: /oauth2
          serviceName: backoffice-bff
          servicePort: 80
        - path: /login
          serviceName: backoffice-bff
          servicePort: 80
        - path: /logout
          serviceName: backoffice-bff
          servicePort: 80
        - path: /api
          serviceName: backoffice-bff
          servicePort: 80
        - path: /catalog
          serviceName: backoffice-bff
          servicePort: 80
        - path: /customers
          serviceName: backoffice-bff
          servicePort: 80
        - path: /sales
          serviceName: backoffice-bff
          servicePort: 80
        - path: /location
          serviceName: backoffice-bff
          servicePort: 80
        - path: /inventory
          serviceName: backoffice-bff
          servicePort: 80
        - path: /promotion
          serviceName: backoffice-bff
          servicePort: 80
        - path: /orders
          serviceName: backoffice-bff
          servicePort: 80

  swagger-ui:
    enabled: true
    schedulingProfile: ui-on-master
    podAnnotations:
      sidecar.istio.io/inject: "false"
    image:
      repository: luongtrz/yas-swagger-ui
      tag: main
    service:
      aliases:
        - swagger-ui
      nodePort: 32085
    ingress:
      enabled: true
      host: swagger-ui-staging.yas.local

  storefront-bff:
    enabled: true
    schedulingProfile: worker-large
    containerPort: 8087
    metricPort: 8087
    image:
      repository: luongtrz/yas-storefront-bff
      tag: 20260709-bff-ui-route-fix3
    service:
      aliases:
        - storefront-bff
    probes:
      mode: tcp
      port: http
    resources:
      requests:
        cpu: 100m
        memory: 192Mi
      limits:
        cpu: 750m
        memory: 768Mi
    hostAliases:
      - ip: 10.43.109.124
        hostnames:
          - identity-dev.yas.local
    env:
      - name: JAVA_TOOL_OPTIONS
        value: "-Xmx192m -Xms64m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=32m"
      - name: YAS_STOREFRONT_UI_URL
        value: http://yas-staging-storefront.yas-staging.svc.cluster.local:3000
      - name: YAS_IDENTITY_INTERNAL_BASE_URL
        value: http://identity-dev.yas.local

  backoffice-bff:
    enabled: true
    schedulingProfile: worker-large
    containerPort: 8087
    metricPort: 8087
    image:
      repository: luongtrz/yas-backoffice-bff
