global:
  environment: dev
  namespace: yas-dev
  domainName: storefront-dev.yas.local

services:
  storefront:
    enabled: true
    image:
      repository: docker.io/example/yas-storefront
      tag: main
    ingress:
      enabled: true
      host: storefront-dev.yas.local
  backoffice:
    enabled: true
    image:
      repository: docker.io/example/yas-backoffice
      tag: main
    ingress:
      enabled: true
      host: backoffice-dev.yas.local
  storefront-bff:
    enabled: true
    image:
      repository: docker.io/example/yas-storefront-bff
      tag: main
  backoffice-bff:
    enabled: true
    image:
      repository: docker.io/example/yas-backoffice-bff
      tag: main
  product:
    enabled: true
    image:
      repository: docker.io/example/yas-product
      tag: main
  media:
    enabled: false
  cart:
    enabled: true
    image:
      repository: docker.io/example/yas-cart
      tag: main
  customer:
    enabled: true
    image:
      repository: docker.io/example/yas-customer
      tag: main
  rating:
    enabled: true
    image:
      repository: docker.io/example/yas-rating
      tag: main
  location:
    enabled: true
    image:
      repository: docker.io/example/yas-location
      tag: main
  order:
    enabled: true
    image:
      repository: docker.io/example/yas-order
      tag: main
  inventory:
    enabled: true
    image:
      repository: docker.io/example/yas-inventory
      tag: main
  tax:
    enabled: true
    image:
      repository: docker.io/example/yas-tax
      tag: main
  search:
    enabled: false
  promotion:
    enabled: false
  payment:
    enabled: false
  payment-paypal:
    enabled: false
  recommendation:
    enabled: false
  sampledata:
    enabled: false
  webhook:
    enabled: false
