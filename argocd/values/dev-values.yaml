global:
  environment: dev
  namespace: yas-dev
  domainName: storefront-dev.yas.local

services:
  storefront:
    enabled: true
    image:
      repository: docker.io/luongtrz/yas-storefront
      tag: main
    ingress:
      enabled: true
      host: storefront-dev.yas.local

  backoffice:
    enabled: true
    image:
      repository: docker.io/luongtrz/yas-backoffice
      tag: main
    ingress:
      enabled: true
      host: backoffice-dev.yas.local

  storefront-bff:
    enabled: true
    image:
      repository: docker.io/luongtrz/yas-storefront-bff
      tag: main

  backoffice-bff:
    enabled: true
    image:
      repository: docker.io/luongtrz/yas-backoffice-bff
      tag: main

  product:
    enabled: true
    image:
      repository: docker.io/luongtrz/yas-product
      tag: main

  media:
    enabled: true
    image:
      repository: docker.io/luongtrz/yas-media
      tag: main

  cart:
    enabled: true
    image:
      repository: docker.io/luongtrz/yas-cart
      tag: main

  order:
    enabled: true
    image:
      repository: docker.io/luongtrz/yas-order
      tag: main

  customer:
    enabled: true
    image:
      repository: docker.io/luongtrz/yas-customer
      tag: main

  inventory:
    enabled: true
    image:
      repository: docker.io/luongtrz/yas-inventory
      tag: main

  tax:
    enabled: true
    image:
      repository: docker.io/luongtrz/yas-tax
      tag: main

  search:
    enabled: true
    image:
      repository: docker.io/luongtrz/yas-search
      tag: main

  sampledata:
    enabled: true
    image:
      repository: docker.io/luongtrz/yas-sampledata
      tag: main

  swagger-ui:
    enabled: true
    image:
      repository: docker.io/luongtrz/yas-swagger-ui
      tag: main

  # Non-baseline services — disabled
  rating:
    enabled: false
  location:
    enabled: false
  promotion:
    enabled: false
  payment:
    enabled: false
  payment-paypal:
    enabled: false
  recommendation:
    enabled: false
  webhook:
    enabled: false
