global:
  environment: dev
  namespace: yas-dev
  domainName: storefront-dev.yas.local

services:
  storefront:
    enabled: true
    image:
      repository: luongtrz/yas-storefront
      tag: main
    ingress:
      enabled: true
      host: storefront-dev.yas.local
  backoffice:
    enabled: true
    image:
      repository: luongtrz/yas-backoffice
      tag: main
    ingress:
      enabled: true
      host: backoffice-dev.yas.local
  storefront-bff:
    enabled: true
    image:
      repository: luongtrz/yas-storefront-bff
      tag: main
  backoffice-bff:
    enabled: true
    image:
      repository: luongtrz/yas-backoffice-bff
      tag: main
  product:
    enabled: true
    image:
      repository: luongtrz/yas-product
      tag: main
  media:
    enabled: true
    image:
      repository: luongtrz/yas-media
      tag: main
  cart:
    enabled: true
    image:
      repository: luongtrz/yas-cart
      tag: main
  customer:
    enabled: true
    image:
      repository: luongtrz/yas-customer
      tag: main
  rating:
    enabled: false
  location:
    enabled: false
  order:
    enabled: true
    image:
      repository: luongtrz/yas-order
      tag: main
  inventory:
    enabled: true
    image:
      repository: luongtrz/yas-inventory
      tag: main
  tax:
    enabled: true
    image:
      repository: luongtrz/yas-tax
      tag: main
  search:
    enabled: true
    image:
      repository: luongtrz/yas-search
      tag: main
  promotion:
    enabled: false
  payment:
    enabled: false
  payment-paypal:
    enabled: false
  recommendation:
    enabled: false
  sampledata:
    enabled: true
    image:
      repository: luongtrz/yas-sampledata
      tag: main
  swagger-ui:
    enabled: true
    image:
      repository: luongtrz/yas-swagger-ui
      tag: main
    ingress:
      enabled: true
      host: swagger-ui-dev.yas.local
  webhook:
    enabled: false
