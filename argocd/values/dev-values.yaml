global:
  environment: dev
  namespace: yas-dev
  domainName: storefront-dev.yas.local
  resourceProfiles:
    backend:
      requests:
        cpu: 50m
        memory: 192Mi
      limits:
        cpu: 500m
        memory: 768Mi

services:
  storefront:
    enabled: true
    schedulingProfile: ui-on-master
    image:
      repository: luongtrz/yas-storefront
      tag: main
    ingress:
      enabled: true
      host: storefront-dev.yas.local
  backoffice:
    enabled: true
    schedulingProfile: ui-on-master
    image:
      repository: luongtrz/yas-backoffice
      tag: main
    ingress:
      enabled: true
      host: backoffice-dev.yas.local
  storefront-bff:
    enabled: true
    containerPort: 8087
    metricPort: 8087
    image:
      repository: luongtrz/yas-storefront-bff
      tag: 20260705-step2fix2
    probes:
      mode: tcp
      port: http
  backoffice-bff:
    enabled: true
    containerPort: 8087
    metricPort: 8087
    image:
      repository: luongtrz/yas-backoffice-bff
      tag: 20260705-step2fix2
    probes:
      mode: tcp
      port: http
  product:
    enabled: true
    containerPort: 8080
    metricPort: 8080
    probes:
      mode: tcp
      port: http
    image:
      repository: luongtrz/yas-product
      tag: main
    env:
      - name: JAVA_TOOL_OPTIONS
        value: "-Xmx192m -Xms64m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=32m"
      - name: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://postgres.yas-dev.svc.cluster.local:5432/product
      - name: SPRING_DATASOURCE_USERNAME
        value: admin
      - name: SPRING_DATASOURCE_PASSWORD
        value: admin
      # Bypass the external API prefix: product expects the media root URL and
      # appends /medias itself. Service-to-service traffic remains inside Istio.
      - name: YAS_SERVICES_MEDIA
        value: http://media.yas-dev.svc.cluster.local
  media:
    enabled: true
    containerPort: 8083
    metricPort: 8083
    probes:
      mode: tcp
      port: http
    image:
      repository: luongtrz/yas-media
      # Immutable build containing the public GET /medias/** security rule.
      tag: f4617c4-mediaauth
    env:
      - name: JAVA_TOOL_OPTIONS
        value: "-Xmx192m -Xms64m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=32m"
      - name: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://postgres.yas-dev.svc.cluster.local:5432/media
      - name: SPRING_DATASOURCE_USERNAME
        value: admin
      - name: SPRING_DATASOURCE_PASSWORD
        value: admin
  cart:
    enabled: true
    containerPort: 8084
    metricPort: 8084
    probes:
      mode: tcp
      port: http
    image:
      repository: luongtrz/yas-cart
      tag: main
    env:
      - name: JAVA_TOOL_OPTIONS
        value: "-Xmx192m -Xms64m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=32m"
      - name: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://postgres.yas-dev.svc.cluster.local:5432/cart
      - name: SPRING_DATASOURCE_USERNAME
        value: admin
      - name: SPRING_DATASOURCE_PASSWORD
        value: admin
  customer:
    enabled: true
    containerPort: 8088
    metricPort: 8088
    probes:
      mode: tcp
      port: http
    image:
      repository: luongtrz/yas-customer
      tag: main
    env:
      - name: JAVA_TOOL_OPTIONS
        value: "-Xmx192m -Xms64m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=32m"
      - name: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://postgres.yas-dev.svc.cluster.local:5432/customer
      - name: SPRING_DATASOURCE_USERNAME
        value: admin
      - name: SPRING_DATASOURCE_PASSWORD
        value: admin
  rating:
    enabled: false
  location:
    enabled: false
  order:
    enabled: true
    containerPort: 8085
    metricPort: 8085
    probes:
      mode: tcp
      port: http
    image:
      repository: luongtrz/yas-order
      tag: main
    env:
      - name: JAVA_TOOL_OPTIONS
        value: "-Xmx192m -Xms64m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=32m"
      - name: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://postgres.yas-dev.svc.cluster.local:5432/order
      - name: SPRING_DATASOURCE_USERNAME
        value: admin
      - name: SPRING_DATASOURCE_PASSWORD
        value: admin
  inventory:
    enabled: true
    containerPort: 8090
    metricPort: 8090
    probes:
      mode: tcp
      port: http
    image:
      repository: luongtrz/yas-inventory
      tag: main
    env:
      - name: JAVA_TOOL_OPTIONS
        value: "-Xmx192m -Xms64m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=32m"
      - name: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://postgres.yas-dev.svc.cluster.local:5432/inventory
      - name: SPRING_DATASOURCE_USERNAME
        value: admin
      - name: SPRING_DATASOURCE_PASSWORD
        value: admin
  tax:
    enabled: true
    containerPort: 8091
    metricPort: 8091
    probes:
      mode: tcp
      port: http
    image:
      repository: luongtrz/yas-tax
      tag: main
    env:
      - name: JAVA_TOOL_OPTIONS
        value: "-Xmx192m -Xms64m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=32m"
      - name: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://postgres.yas-dev.svc.cluster.local:5432/tax
      - name: SPRING_DATASOURCE_USERNAME
        value: admin
      - name: SPRING_DATASOURCE_PASSWORD
        value: admin
  search:
    enabled: true
    containerPort: 8092
    metricPort: 8092
    probes:
      mode: tcp
      port: http
    image:
      repository: luongtrz/yas-search
      tag: main
    env:
      - name: JAVA_TOOL_OPTIONS
        value: "-Xmx192m -Xms64m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=32m"
      - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
        value: kafka.yas-dev.svc.cluster.local:9092
      - name: SPRING_KAFKA_CONSUMER_BOOTSTRAP_SERVERS
        value: kafka.yas-dev.svc.cluster.local:9092
      - name: SPRING_KAFKA_PRODUCER_BOOTSTRAP_SERVERS
        value: kafka.yas-dev.svc.cluster.local:9092
      - name: ELASTICSEARCH_URL
        value: elasticsearch.yas-dev.svc.cluster.local:9200
  promotion:
    enabled: false
  payment:
    enabled: false
  payment-paypal:
    enabled: false
  recommendation:
    enabled: false
  sampledata:
    enabled: true
    replicaCount: 0
    image:
      repository: luongtrz/yas-sampledata
      tag: main
  swagger-ui:
    enabled: true
    schedulingProfile: ui-on-master
    image:
      repository: luongtrz/yas-swagger-ui
      tag: main
    ingress:
      enabled: true
      host: swagger-ui-dev.yas.local
  webhook:
    enabled: false
