global:
  environment: dev
  namespace: yas-dev
  domainName: storefront-dev.yas.local
  resourceProfiles:
    backend:
      requests:
        cpu: 50m
        memory: 192Mi
      limits:
        cpu: 500m
        memory: 768Mi

services:
  storefront:
    enabled: true
    schedulingProfile: ui-on-master
    podAnnotations:
      sidecar.istio.io/inject: "false"
    image:
      repository: luongtrz/yas-storefront
      tag: main
    ingress:
      enabled: true
      host: storefront-dev.yas.local
      extraPaths:
        - path: /oauth2
          serviceName: yas-dev-storefront-bff
          servicePort: 80
        - path: /login
          serviceName: yas-dev-storefront-bff
          servicePort: 80
        - path: /logout
          serviceName: yas-dev-storefront-bff
          servicePort: 80
        - path: /api
          serviceName: yas-dev-storefront-bff
          servicePort: 80
        - path: /actuator/health
          serviceName: yas-dev-storefront-bff
          servicePort: 80
        - path: /actuator/health/liveness
          serviceName: yas-dev-storefront-bff
          servicePort: 80
        - path: /actuator/health/readiness
          serviceName: yas-dev-storefront-bff
          servicePort: 80
  backoffice:
    enabled: true
    schedulingProfile: ui-on-master
    podAnnotations:
      sidecar.istio.io/inject: "false"
    image:
      repository: luongtrz/yas-backoffice
      tag: main
    ingress:
      enabled: true
      host: backoffice-dev.yas.local
      extraPaths:
        - path: /oauth2
          serviceName: yas-dev-backoffice-bff
          servicePort: 80
        - path: /login
          serviceName: yas-dev-backoffice-bff
          servicePort: 80
        - path: /logout
          serviceName: yas-dev-backoffice-bff
          servicePort: 80
        - path: /api
          serviceName: yas-dev-backoffice-bff
          servicePort: 80
        - path: /catalog
          serviceName: yas-dev-backoffice-bff
          servicePort: 80
        - path: /customers
          serviceName: yas-dev-backoffice-bff
          servicePort: 80
        - path: /sales
          serviceName: yas-dev-backoffice-bff
          servicePort: 80
        - path: /location
          serviceName: yas-dev-backoffice-bff
          servicePort: 80
        - path: /inventory
          serviceName: yas-dev-backoffice-bff
          servicePort: 80
        - path: /promotion
          serviceName: yas-dev-backoffice-bff
          servicePort: 80
        - path: /tax
          serviceName: yas-dev-backoffice-bff
          servicePort: 80
        - path: /system
          serviceName: yas-dev-backoffice-bff
          servicePort: 80
        - path: /webhook
          serviceName: yas-dev-backoffice-bff
          servicePort: 80
        - path: /profile
          serviceName: yas-dev-backoffice-bff
          servicePort: 80
        - path: /actuator/health
          serviceName: yas-dev-backoffice-bff
          servicePort: 80
        - path: /actuator/health/liveness
          serviceName: yas-dev-backoffice-bff
          servicePort: 80
        - path: /actuator/health/readiness
          serviceName: yas-dev-backoffice-bff
          servicePort: 80
  storefront-bff:
    enabled: true
    containerPort: 8087
    metricPort: 8087
    image:
      repository: luongtrz/yas-storefront-bff
      tag: 20260709-bff-ui-route-fix3
    hostAliases:
      - ip: 10.43.109.124
        hostnames:
          - identity-dev.yas.local
    probes:
      mode: tcp
      port: http
    env:
      - name: YAS_STOREFRONT_UI_URL
        value: http://yas-dev-storefront.yas-dev.svc.cluster.local:3000
      - name: YAS_IDENTITY_INTERNAL_BASE_URL
        value: http://identity-dev.yas.local
  backoffice-bff:
    enabled: true
    containerPort: 8087
    metricPort: 8087
    image:
      repository: luongtrz/yas-backoffice-bff
      tag: 20260709-bff-ui-route-fix3
    hostAliases:
      - ip: 10.43.109.124
        hostnames:
          - identity-dev.yas.local
    probes:
      mode: tcp
      port: http
    env:
      - name: YAS_BACKOFFICE_UI_URL
        value: http://yas-dev-backoffice.yas-dev.svc.cluster.local:3000
      - name: YAS_IDENTITY_INTERNAL_BASE_URL
        value: http://identity-dev.yas.local
  product:
    enabled: true
    containerPort: 8080
    metricPort: 8080
    probes:
      mode: tcp
      port: http
    image:
      repository: luongtrz/yas-product
      tag: main
    service:
      aliases:
        - product
    env:
      - name: JAVA_TOOL_OPTIONS
        value: "-Xmx192m -Xms64m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=32m"
      - name: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://postgres.yas-dev.svc.cluster.local:5432/product
      - name: SPRING_DATASOURCE_USERNAME
        value: admin
      - name: SPRING_DATASOURCE_PASSWORD
        value: admin
      - name: YAS_SERVICES_MEDIA
        value: http://media.yas-dev.svc.cluster.local/media
  media:
    enabled: true
    schedulingProfile: ui-on-master
    containerPort: 8083
    metricPort: 8083
    probes:
      mode: tcp
      port: http
    image:
      repository: luongtrz/yas-media
      # Immutable build containing the public GET /medias/** security rule.
      tag: f4617c4-mediaauth
    service:
      aliases:
        - media
    extraVolumes:
      - name: media-sample-images
        hostPath:
          path: /home/luong/project2/yas-source/sampledata/images
          type: Directory
    extraVolumeMounts:
      - name: media-sample-images
        mountPath: /images
        readOnly: true
    env:
      - name: JAVA_TOOL_OPTIONS
        value: "-Xmx192m -Xms64m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=32m"
      - name: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://postgres.yas-dev.svc.cluster.local:5432/media
      - name: SPRING_DATASOURCE_USERNAME
        value: admin
      - name: SPRING_DATASOURCE_PASSWORD
        value: admin
      - name: SERVER_SERVLET_CONTEXT_PATH
        value: /media
      - name: YAS_PUBLICURL
        value: http://api.yas.local/media
  cart:
    enabled: true
    containerPort: 8084
    metricPort: 8084
    probes:
      mode: tcp
      port: http
    image:
      repository: luongtrz/yas-cart
      tag: main
    service:
      aliases:
        - cart
    env:
      - name: JAVA_TOOL_OPTIONS
        value: "-Xmx192m -Xms64m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=32m"
      - name: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://postgres.yas-dev.svc.cluster.local:5432/cart
      - name: SPRING_DATASOURCE_USERNAME
        value: admin
      - name: SPRING_DATASOURCE_PASSWORD
        value: admin
  customer:
    enabled: true
    containerPort: 8088
    metricPort: 8088
    probes:
      mode: tcp
      port: http
    image:
      repository: luongtrz/yas-customer
      tag: main
    service:
      aliases:
        - customer
    env:
      - name: JAVA_TOOL_OPTIONS
        value: "-Xmx192m -Xms64m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=32m"
      - name: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://postgres.yas-dev.svc.cluster.local:5432/customer
      - name: SPRING_DATASOURCE_USERNAME
        value: admin
      - name: SPRING_DATASOURCE_PASSWORD
        value: admin
  rating:
    enabled: false
  location:
    enabled: false
  order:
    enabled: true
    containerPort: 8085
    metricPort: 8085
    probes:
      mode: tcp
      port: http
    image:
      repository: luongtrz/yas-order
      tag: main
    service:
      aliases:
        - order
    env:
      - name: JAVA_TOOL_OPTIONS
        value: "-Xmx192m -Xms64m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=32m"
      - name: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://postgres.yas-dev.svc.cluster.local:5432/order
      - name: SPRING_DATASOURCE_USERNAME
        value: admin
      - name: SPRING_DATASOURCE_PASSWORD
        value: admin
  inventory:
    enabled: true
    containerPort: 8090
    metricPort: 8090
    probes:
      mode: tcp
      port: http
    image:
      repository: luongtrz/yas-inventory
      tag: main
    service:
      aliases:
        - inventory
    env:
      - name: JAVA_TOOL_OPTIONS
        value: "-Xmx192m -Xms64m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=32m"
      - name: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://postgres.yas-dev.svc.cluster.local:5432/inventory
      - name: SPRING_DATASOURCE_USERNAME
        value: admin
      - name: SPRING_DATASOURCE_PASSWORD
        value: admin
  tax:
    enabled: true
    containerPort: 8091
    metricPort: 8091
    probes:
      mode: tcp
      port: http
    image:
      repository: luongtrz/yas-tax
      tag: main
    service:
      aliases:
        - tax
    env:
      - name: JAVA_TOOL_OPTIONS
        value: "-Xmx192m -Xms64m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=32m"
      - name: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://postgres.yas-dev.svc.cluster.local:5432/tax
      - name: SPRING_DATASOURCE_USERNAME
        value: admin
      - name: SPRING_DATASOURCE_PASSWORD
        value: admin
  search:
    enabled: true
    containerPort: 8092
    metricPort: 8092
    probes:
      mode: tcp
      port: http
    image:
      repository: luongtrz/yas-search
      tag: main
    service:
      aliases:
