    env:
      - name: JAVA_TOOL_OPTIONS
        value: "-Xmx192m -Xms64m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=32m"
      - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
        value: kafka.yas-dev.svc.cluster.local:9092
      - name: SPRING_KAFKA_CONSUMER_BOOTSTRAP_SERVERS
        value: kafka.yas-dev.svc.cluster.local:9092
      - name: SPRING_KAFKA_PRODUCER_BOOTSTRAP_SERVERS
        value: kafka.yas-dev.svc.cluster.local:9092
      - name: ELASTICSEARCH_URL
        value: elasticsearch.yas-dev.svc.cluster.local:9200
  promotion:
    enabled: false
  payment:
    enabled: false
  payment-paypal:
    enabled: false
  recommendation:
    enabled: false
  sampledata:
    enabled: true
    replicaCount: 0
    image:
      repository: luongtrz/yas-sampledata
      tag: main
    service:
      aliases:
        - sampledata
  swagger-ui:
    enabled: true
    schedulingProfile: ui-on-master
    podAnnotations:
      sidecar.istio.io/inject: "false"
    image:
      repository: luongtrz/yas-swagger-ui
      tag: main
    ingress:
      enabled: true
      host: swagger-ui-dev.yas.local
  webhook:
    enabled: false
